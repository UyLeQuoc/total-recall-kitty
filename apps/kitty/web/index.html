<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kitty · the group pot that saves itself</title>
    <meta
      name="description"
      content="Kitty: a group pot on Sui. Everyone signs once; Kitty pulls each share after payday and spends only the way the group agreed."
    />
    <meta name="application-name" content="Kitty" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF9F6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#262624" />
    <!-- The logo's tile and glyph (components/logo.tsx) in Remora's indigo (ADR-0066). -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-3 -3 30 30'%3E%3Crect x='-3' y='-3' width='30' height='30' rx='7.2' fill='%236355EB'/%3E%3Cpath fill='white' fill-rule='evenodd' d='M5 3.2L9.6 7.2H14.4L19 3.2A0.8 0.8 0 0 1 20.3 3.8V14A7 7 0 0 1 13.3 21H10.7A7 7 0 0 1 3.7 14V3.8A0.8 0.8 0 0 1 5 3.2ZM7.6 13.4A1.4 1.4 0 1 0 10.4 13.4A1.4 1.4 0 1 0 7.6 13.4ZM13.6 13.4A1.4 1.4 0 1 0 16.4 13.4A1.4 1.4 0 1 0 13.6 13.4ZM10.9 16.2H13.1L12 17.5Z'/%3E%3C/svg%3E"
    />
    <!--
      Decide the theme before the first paint, as Remora does: React sets the same class after mount,
      which is long enough for a dark-mode reader to get a white flash. Wrapped because storage throws
      in a private window.
    -->
    <script>
      try {
        const saved = localStorage.getItem("kitty.theme");
        const dark =
          saved === "dark" ||
          ((saved === null || saved === "system") &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
